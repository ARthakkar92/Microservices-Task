apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  labels:
    app: order-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
      - name: order-service

        image: ankitthakkar/order-service:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 3002

        env:
        - name: NODE_ENV
          value: "production"

        - name: USER_SERVICE_URL
          value: "http://user-service:3000"

        - name: PRODUCT_SERVICE_URL
          value: "http://product-service:3001"

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "200m"

        readinessProbe:
          httpGet:
            path: /
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
